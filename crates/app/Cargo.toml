[package]
name = "galdr"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "galdr"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14" }
media = { path = "../media" }
galdr-core = { path = "../core" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
anyhow = "1"
cpal = "0.18"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }
